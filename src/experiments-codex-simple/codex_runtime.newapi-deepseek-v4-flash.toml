# PatchHound experiments-codex-simple runtime for the NewAPI DeepSeek V4 Flash smoke test.
# The API key is intentionally supplied through PATCHHOUND_DEEPSEEK_API_KEY at runtime;
# it must not be written to this file or to experiment artifacts.

model_provider = "newapi"
model = "deepseek/deepseek-v4-flash"
model_reasoning_effort = "high"
cli_auth_credentials_store = "file"
disable_response_storage = true
approval_policy = "never"
default_permissions = "patch_review"
project_root_markers = []

[model_providers.newapi]
name = "NewAPI"
base_url = "https://api.example.invalid/v1"
env_key = "PATCHHOUND_DEEPSEEK_API_KEY"
wire_api = "responses"
requires_openai_auth = false

[features]
memories = false

[memories]
generate_memories = false
use_memories = false
disable_on_external_context = true

[history]
persistence = "none"

[permissions.patch_review.filesystem]
":minimal" = "read"

[permissions.patch_review.filesystem.":workspace_roots"]
"." = "read"

[permissions.patch_review.network]
enabled = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
