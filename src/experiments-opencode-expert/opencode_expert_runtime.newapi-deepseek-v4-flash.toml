# OpenCode expert runtime for the NewAPI DeepSeek comparison run.
# PATCHHOUND_DEEPSEEK_API_KEY is injected into the outer sidecar only.

[experiment]
logical_model = "deepseek/deepseek-v4-flash"
model_selector = "newapi/deepseek/deepseek-v4-flash"
provider = "newapi"
reasoning_effort = "high"
timeout_seconds = 7200
max_contract_repairs = 0
history_mcp_required = true
network_enabled = false
output_dir_name = "opencode-expert-runs"

[runtime]
cli_version = "1.18.25"
sdk_version = "1.18.25"
sidecar_protocol_version = 1
server_ready_timeout_seconds = 15
mcp_timeout_ms = 30000
dispose_grace_seconds = 5
auth_required = false

[tools]
enabled = ["bash", "read", "glob", "grep", "patchhound_history_query_pre_patch_history"]
disabled = ["apply_patch", "edit", "write", "task", "skill", "lsp", "todowrite", "question", "websearch", "webfetch"]

[limits]
message_bytes = 1048576
stderr_bytes = 131072
tool_output_bytes = 131072
event_output_bytes = 131072
total_event_bytes = 67108864

[phoenix]
enabled = true
collector_endpoint = "http://127.0.0.1:6006/v1/traces"
project_name = "patchhound-experiments-opencode-expert-deepseek-v4-flash"
max_tool_output_bytes = 131072
