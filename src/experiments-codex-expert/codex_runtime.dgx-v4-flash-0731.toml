# PatchHound experiments-codex-expert Codex SDK runtime settings — self-hosted DGX
# Spark DeepSeek V4 Flash (pinned 0731) run. Copied into an isolated CODEX_HOME
# for every independent expert stage. The endpoint is unauthenticated vLLM;
# PATCHHOUND_DGX_API_KEY is a placeholder resolved from the process
# environment or the repository .env by the host runner.

model_provider = "dgx"
model = "deepseek-v4-flash-0731"
model_reasoning_effort = "high"
preferred_auth_method = "apikey"
disable_response_storage = true
approval_policy = "never"
default_permissions = "patch_review"
project_root_markers = []

[model_providers.dgx]
name = "DGX Spark DeepSeek V4 Flash 0731"
base_url = "http://127.0.0.1:8000/v1"
wire_api = "responses"
env_key = "PATCHHOUND_DGX_API_KEY"

[features]
memories = false

[phoenix]
enabled = true
collector_endpoint = "http://127.0.0.1:6006/v1/traces"
project_name = "patchhound-experiments-codex-expert-dgx-v4-flash-0731"
max_tool_output_bytes = 131072

[memories]
generate_memories = false
use_memories = false
disable_on_external_context = true

[history]
persistence = "none"

[permissions.patch_review.filesystem]
":minimal" = "read"

[permissions.patch_review.filesystem.":workspace_roots"]
"." = "read"

[permissions.patch_review.network]
enabled = false

[shell_environment_policy]
inherit = "core"
ignore_default_excludes = false
exclude = ["PATCHHOUND_DGX_API_KEY"]
