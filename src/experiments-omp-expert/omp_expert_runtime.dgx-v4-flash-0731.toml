# OMP expert runtime for the self-hosted DGX Spark DeepSeek V4 Flash 0731 run.
# The endpoint is unauthenticated vLLM; PATCHHOUND_DGX_API_KEY is a placeholder
# injected into the outer sidecar only. Timeout 10800s follows the pinned-0731
# expert precedent on the slower serving path.

[experiment]
logical_model = "deepseek-v4-flash-0731"
model_selector = "dgx/deepseek-v4-flash-0731"
provider = "dgx"
reasoning_effort = "high"
timeout_seconds = 10800
max_contract_repairs = 0
history_mcp_required = true
network_enabled = false
output_dir_name = "omp-expert-runs"

[runtime]
omp_sdk_version = "18.0.11"
bun_min_version = "1.3.14"
source_revision = "eea5628f13043286e17c4a2ea4fc28b15fda33ca"
sidecar_protocol_version = 1
server_ready_timeout_seconds = 15
mcp_timeout_ms = 30000
dispose_grace_seconds = 5
auth_required = false

[tools]
enabled = ["read", "grep", "glob", "bash", "query_pre_patch_history"]
disabled = ["edit", "write", "apply_patch", "patch", "task", "subagent", "lsp", "browser", "skill", "memory", "question", "todowrite"]

[limits]
message_bytes = 1048576
stderr_bytes = 131072
tool_output_bytes = 131072
event_output_bytes = 131072
total_event_bytes = 67108864

[phoenix]
enabled = true
collector_endpoint = "http://127.0.0.1:6006/v1/traces"
project_name = "patchhound-experiments-omp-expert-dgx-v4-flash-0731"
max_tool_output_bytes = 131072

[project]
name = "patchhound-experiments-omp-expert-dgx-v4-flash-0731"
version = "0.1.0"
