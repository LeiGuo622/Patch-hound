services:
  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped
    # Host networking avoids Docker's userspace/NAT port-forwarding path,
    # which can accept a connection without forwarding any bytes on some
    # local Docker installations. Bind all host interfaces so a browser on
    # another machine can reach the UI.
    network_mode: host
    environment:
      PHOENIX_HOST: 0.0.0.0
      PHOENIX_WORKING_DIR: /mnt/data
    volumes:
      - phoenix_data:/mnt/data

volumes:
  phoenix_data:
